[project]
name = "decision-arena"
version = "0.1.0"
description = "Fast decision models race each other in a real-time 3D runner game."
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "websockets>=13",
]

[project.scripts]
decision-arena = "decision_arena.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
