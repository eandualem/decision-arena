[project]
name = "decision-arena"
version = "0.1.0"
description = "Fast decision models play a real-time light-cycle game."
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "starlette>=0.40",
    "uvicorn>=0.30",
    "websockets>=13",
]

[project.scripts]
decision-arena = "decision_arena.server:main"

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
